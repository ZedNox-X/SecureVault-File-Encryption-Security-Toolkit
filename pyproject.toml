[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securevault"
version = "1.0.0"
description = "Defensive file encryption and integrity verification toolkit"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43.0,<47.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
